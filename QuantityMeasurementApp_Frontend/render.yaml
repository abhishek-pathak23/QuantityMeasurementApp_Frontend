services:
  - type: web
    name: quantity-measurement-frontend
    env: static
    buildCommand: "npm install --production=false && npm run build --configuration production"
    staticPublishPath: dist/quantity-measurement-app/browser
    routes:
      - type: rewrite
        source: /(.*) 
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: NODE_OPTIONS
        value: "--max-old-space-size=1536"
      - key: API_BASE_URL
        value: "https://your-backend-service.onrender.com"
