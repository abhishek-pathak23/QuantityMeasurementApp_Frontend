<div class="signup-container">
  <div class="signup-card">
    <div class="signup-header">
      <h1>Sign Up</h1>
      <p>Join us and start measuring quantities with ease!</p>
    </div>

    <form class="signup-form" (ngSubmit)="onSignup()">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          [(ngModel)]="name"
          name="name"
          placeholder="Enter your full name"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Enter your email"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Create a strong password"
          required
        />
      </div>

      <button type="submit" class="btn-signup" [disabled]="loading">
        {{ loading ? 'Creating account...' : 'Create Account' }}
      </button>
    </form>

    <div class="signup-footer">
      <p>Already have an account? <a href="#" (click)="goToLogin($event)">Log In</a></p>
      <p>Or continue as <a href="#" (click)="continueAsGuest($event)">Guest</a></p>
    </div>

    <div *ngIf="errorMsg" class="error-message">
      {{ errorMsg }}
    </div>

    <div *ngIf="successMsg" class="success-message">
      {{ successMsg }}
    </div>
  </div>
</div>
